baseURL = ""
title = "Resugo"
defaultContentLanguage = "fr"

# Modules résolus sur les dépôts locaux par bin/hugo.work (aussi pour hugo server).
# La prod (config/production) garde les versions épinglées par go.mod.
theme = ["github.com/lowdit/resugo", "github.com/lowdit/lowdit-kit"]

[params.lowdit]
  logo = "logos/resugo.png"
  faviconDir = "favicons/resugo"
  socialImage = "/assets/social/twittercard-default.png"
  model = "cv"
  homeEyebrow = "CV · galerie"

[[menus.main]]
  name = "Accueil"
  url = "/"
  weight = 1
[[menus.main]]
  name = "Installation"
  url = "/installation/"
  weight = 2

# Pas d'entrée « CV » : l'accueil est déjà la galerie complète des profils.
# L'index /resume/ reste accessible directement.

[markup.goldmark.renderer]
  unsafe = true

[module]
  # Espace de travail local : lowdit-kit et les modules du disque.
  workspace = "../../bin/hugo.work"
