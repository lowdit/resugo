<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1172 260" role="img" aria-labelledby="carte-titre carte-desc" lang="fr">
<title id="carte-titre">Carte de continuité — Bertrand Keller</title>
<desc id="carte-desc">Carte de continuité du travail produit. Je relie la vision à l'exécution sur six domaines : Produit (prouvé) : vision, roadmap, arbitrages tracés. Design (pratique) : parcours, critères d'acceptation. Technique (pratique) : architecture web, modules Hugo. Delivery (prouvé) : incréments cadrés, validation humaine. Qualité et conformité (prouvé) : recette, Definition of Done, RGAA. IA (pratique) : délégation cadrée, contrôle, veille. Niveaux : prouvé, pratique, transférable, à acquérir ; chaque niveau renvoie à une preuve détaillée dans le CV.</desc>
<rect x="0" y="0" width="1172" height="260" fill="#f6f1e7"/>
<text x="10" y="30" font-family="sans-serif" font-size="17" font-weight="700" fill="#2b4c7e">Trait d'union : je relie la vision produit à l'exécution</text>
<text x="10" y="50" font-family="sans-serif" font-size="12" fill="#1c2b3a">L'IA exécute et propose. Je cadre, je contrôle et je décide, avec l'équipe.</text>
