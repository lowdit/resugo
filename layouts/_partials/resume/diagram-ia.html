{{- /* Diagramme « Comment je pilote un produit avec l'IA » généré depuis des données texte.
       Aucune image : HTML/CSS, texte réel, lisible et imprimable. */ -}}
{{- $d := .data -}}
{{- if $d -}}
<style>
  .resume-diagram-ia {
    margin: 1.5em 0;
    padding: 0;
    max-width: 100%;
  }
  .resume-diagram-ia__panel {
    max-width: 100%;
    padding: 18px 20px 14px;
    border-radius: 14px;
    background: #f5ece1;
    color: #1c1c1c;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.3;
  }
  .resume-diagram-ia__title {
    margin-bottom: 14px;
    font-size: 1.12em;
    font-weight: 800;
  }
  .resume-diagram-ia__eyebrow {
    margin-bottom: 6px;
    color: #a34722;
    font-size: 0.7em;
    font-weight: 800;
    letter-spacing: 0.09em;
    text-transform: uppercase;
  }
  .resume-diagram-ia__pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .resume-diagram-ia__pill {
    flex: 1 1 0;
    min-width: 120px;
    padding: 6px 10px;
    border: 1px solid #dfb08a;
    border-radius: 999px;
    background: #fbf3ea;
    font-size: 0.82em;
    text-align: center;
  }
  .resume-diagram-ia__steps {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-bottom: 4px;
  }
  .resume-diagram-ia__step {
    flex: 1 1 0;
    min-width: 0;
    overflow: hidden;
    border: 1.5px solid #2b4c7e;
    border-radius: 6px;
    background: #fff;
  }
  .resume-diagram-ia__step-title {
    padding: 4px 5px;
    background: #2b4c7e;
    color: #fff;
    font-size: 0.85em;
    font-weight: 700;
    text-align: center;
  }
  .resume-diagram-ia__step-body {
    padding: 6px 7px;
    font-size: 0.76em;
    text-align: center;
  }
  .resume-diagram-ia__arrow {
    align-self: center;
    padding: 0 5px;
    color: #2b4c7e;
    font-size: 1.1em;
    font-weight: 800;
  }
  .resume-diagram-ia__loop {
    margin-bottom: 14px;
    color: #746454;
    font-size: 0.72em;
    text-align: center;
  }
  .resume-diagram-ia__avoid {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 12px;
    border-radius: 8px;
    background: #2b4c7e;
    color: #fff;
    font-size: 0.8em;
  }
  .resume-diagram-ia__avoid-label {
    color: #f7c3a6;
    font-weight: 800;
    white-space: nowrap;
  }
  .resume-diagram-ia__legend {
    margin-top: 10px;
    color: #5c4f44;
    font-size: 0.78em;
    font-style: italic;
    text-align: center;
  }

  @media screen and (max-width: 50rem) {
    .resume-diagram-ia__panel {
      padding: 14px 12px 12px;
      border-radius: 10px;
    }
    .resume-diagram-ia__steps {
      flex-direction: column;
      gap: 6px;
    }
    .resume-diagram-ia__arrow {
      flex: 0 0 auto;
      padding: 1px 0;
      transform: rotate(90deg);
    }
    .resume-diagram-ia__step {
      flex: 0 0 auto;
      width: 100%;
    }
    .resume-diagram-ia__pill {
      flex-basis: 100%;
      min-width: 0;
    }
    .resume-diagram-ia__avoid {
      flex-direction: column;
      gap: 4px;
      align-items: flex-start;
    }
    .resume-diagram-ia__avoid-label {
      white-space: normal;
    }
  }
</style>
<figure class="resume-diagram-ia">
  <div class="resume-diagram-ia__panel">

    <div class="resume-diagram-ia__title">{{ $d.titre }}</div>

    <div class="resume-diagram-ia__eyebrow">Ce que je vise</div>
    <div class="resume-diagram-ia__pills">
      {{- range $d.vise }}
      <span class="resume-diagram-ia__pill">{{ . }}</span>
      {{- end }}
    </div>

    <div class="resume-diagram-ia__eyebrow">Comment je travaille avec l'IA</div>
    <div class="resume-diagram-ia__steps">
      {{- range $i, $e := $d.etapes }}
      {{- if $i }}<div class="resume-diagram-ia__arrow" aria-hidden="true">→</div>{{ end }}
      <div class="resume-diagram-ia__step">
        <div class="resume-diagram-ia__step-title">{{ $e.titre }}</div>
        <div class="resume-diagram-ia__step-body">
          {{- range $e.lignes }}<div>{{ . }}</div>{{ end }}
        </div>
      </div>
      {{- end }}
    </div>
    <div class="resume-diagram-ia__loop">↻ à chaque incrément</div>

    <div class="resume-diagram-ia__avoid">
      <div class="resume-diagram-ia__avoid-label">Ce que j'évite</div>
      <div>{{ delimit $d.eviter " · " }}</div>
    </div>

    <div class="resume-diagram-ia__legend">{{ $d.legende }}</div>
  </div>
</figure>
{{- end -}}
