[module]
  [module.hugoVersion]
    extended = true
    min = "0.128.0"

[markup.goldmark.renderer]
  unsafe = true

[build]
[frontmatter]
  _merge = 'deep'
[outputformats]
  _merge = 'deep'
[outputs]
  _merge = 'deep'
[cascade]
  _merge = 'deep'

[outputFormats.resume]
  baseName = "print"
  mediaType = "text/html"
  notAlternative = false
  permalinkable = true
  isHTML = true

# Modèle servi par resugo : accueil CV et feuille vitrine.
[params.lowdit.models.cv]
  home = "home/cv.html"
  sheet = "cv-vitrine"
